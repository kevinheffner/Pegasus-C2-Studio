<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Browser tab icon: the stepped wing plus the P of Pegasus.
       The dark plate is deliberate. Light-blue bars on a transparent ground
       would disappear against a light browser tab, so the icon carries its
       own background and reads on any chrome, light or dark. -->
  <rect width="64" height="64" rx="4" fill="#16293c"/>

  <!-- Wing: three stepped bars, light blue -->
  <g fill="#9ec8ea">
    <path d="M7 15 H29 L23 24 H7 Z"/>
    <path d="M7 28 H25 L19 37 H7 Z"/>
    <path d="M7 41 H21 L15 50 H7 Z"/>
  </g>

  <!-- P -->
  <path fill="#ffffff" fill-rule="evenodd"
        d="M34 14 H48.5 C55 14 59.5 18.6 59.5 25 C59.5 31.4 55 36 48.5 36 H42 V50 H34 Z
           M42 21.5 V28.5 H48 C50.3 28.5 52 27 52 25 C52 23 50.3 21.5 48 21.5 Z"/>
</svg>
